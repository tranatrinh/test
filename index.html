<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Story Reader - Perfect Parser & Siri</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #131a2a;
            --surface-2: #1e293b;
            --border: #283548;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.25);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
        }
        header {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
        }
        .brand { font-weight: 700; font-size: 15px; color: var(--accent); display: flex; align-items: center; gap: 6px; }
        .pill-btn {
            background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .pill-btn:active { opacity: 0.75; }
        .chapter-bar {
            background: #0f1523; padding: 8px 14px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        #chapterSelect {
            flex: 1; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
            border-radius: 8px; padding: 7px 10px; font-size: 13px; outline: none; min-width: 0;
        }
        #storyContainer {
            flex: 1; overflow-y: auto; padding: 18px 16px 32px 16px;
            font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.75; color: #cbd5e1;
            max-width: 780px; width: 100%; margin: 0 auto;
        }
        #storyContainer p {
            margin: 0 0 14px 0; padding: 10px 12px; border-radius: 10px; border-left: 3px solid transparent; cursor: pointer; transition: background 0.2s;
        }
        #storyContainer p.active-chunk { background: rgba(16, 185, 129, 0.15); border-left-color: var(--accent); color: #fff; }
        
        .player-dock {
            background: var(--surface); border-top: 1px solid var(--border);
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom)) 16px;
            display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
        }
        .status-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); gap: 8px; }
        #status { color: #fcd34d; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        
        .auto-play-btn {
            background: var(--accent); color: #042f2e; border: none; border-radius: 99px;
            padding: 10px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 15px var(--accent-glow);
            flex: 1; justify-content: center;
        }
        .auto-play-btn:active { transform: scale(0.96); }
        .dock-select { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 8px; font-size: 12px; font-weight: 600; outline: none; }
    </style>
</head>
<body>

    <header>
        <div class="brand">📖 AI Story Reader</div>
        <div class="header-actions">
            <label class="pill-btn">
                ＋ Mở file (.txt/.epub)
                <input type="file" id="fileInput" accept=".txt,.epub" style="display:none;" onclick="this.value=null;">
            </label>
        </div>
    </header>

    <div class="chapter-bar" id="chapterBar" style="display:none;">
        <select id="chapterSelect" onchange="onChapterChange()"></select>
    </div>

    <main id="storyContainer">
        <div style="text-align:center; padding: 40px 16px; color: var(--text-muted); font-family: sans-serif;">
            <div style="font-size: 40px; margin-bottom: 12px;">🎧</div>
            <div style="font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px;">Trình đọc offline - Giọng Siri</div>
            <div style="font-size: 13px;">Bấm <b>＋ Mở file</b>. Đã chặn lỗi "Unknown" và ưu tiên giọng cao cấp.</div>
        </div>
    </main>

    <footer class="player-dock">
        <div class="status-row">
            <span id="status">Sẵn sàng!</span>
            <span id="chunkCounter">0 / 0</span>
        </div>
        <div class="controls-row">
            <select id="voiceSelect" class="dock-select" onchange="onVoiceChange()" title="Chọn giọng đọc">
                <option value="">🎙 Đang tải giọng...</option>
            </select>

            <select id="speedSelect" class="dock-select" style="max-width:70px;">
                <option value="0.8">0.8x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.2">1.2x</option>
                <option value="1.5">1.5x</option>
                <option value="2.0">2.0x</option>
            </select>

            <button class="auto-play-btn" id="playToggleBtn" onclick="toggleSpeechPlay()">
                🔊 Nghe trang (Instant Play)
            </button>
        </div>
    </footer>

    <script>
        // --- 1. HỆ THỐNG NẠP GIỌNG ĐỌC & ƯU TIÊN SIRI/PREMIUM ---
        const voiceSelect = document.getElementById('voiceSelect');
        let voices = [];
        let selectedVoiceIndex = localStorage.getItem("browser_tts_voice_idx");

        function loadVoices() {
            voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('vi') || v.lang.includes('VN'));
            if (voices.length === 0) voices = window.speechSynthesis.getVoices(); 

            voiceSelect.innerHTML = "";
            let bestIndex = 0; // Ưu tiên tìm giọng Premium

            voices.forEach((v, idx) => {
                const opt = document.createElement("option");
                opt.value = idx;
                opt.textContent = `${v.name} (${v.lang})`;
                voiceSelect.appendChild(opt);

                // Nếu tên giọng có chứa Premium, Siri, hoặc Enhanced thì tự động đánh dấu là tốt nhất
                const lowerName = v.name.toLowerCase();
                if (lowerName.includes("premium") || lowerName.includes("siri") || lowerName.includes("enhanced")) {
                    bestIndex = idx;
                }
            });

            if (voices.length > 0) {
                if (selectedVoiceIndex !== null && selectedVoiceIndex < voices.length) {
                    voiceSelect.value = selectedVoiceIndex;
                } else {
                    // Nếu chưa chọn bao giờ, tự động ép sang giọng ngon nhất tìm được
                    voiceSelect.value = bestIndex;
                    selectedVoiceIndex = bestIndex;
                }
            }
        }

        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function onVoiceChange() {
            selectedVoiceIndex = voiceSelect.value;
            localStorage.setItem("browser_tts_voice_idx", selectedVoiceIndex);
            if (isSpeaking) {
                window.speechSynthesis.cancel();
                playBrowserTTS(currentChunkIndex);
            }
        }


        const fileInput = document.getElementById('fileInput');
        const storyContainer = document.getElementById('storyContainer');
        const status = document.getElementById('status');
        const chapterSelect = document.getElementById('chapterSelect');
        const playToggleBtn = document.getElementById('playToggleBtn');
        const chunkCounter = document.getElementById('chunkCounter');
        const speedSelect = document.getElementById('speedSelect');

        let chapters = [];
        let currentChapterIndex = 0;
        let chunks = [];
        let currentChunkIndex = 0;
        let isSpeaking = false;

        const silentAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAAAAAA==");
        silentAudio.loop = true;

        // --- 2. HỆ THỐNG PHÂN TÍCH CHƯƠNG CHUẨN XÁC CỦA MÀY ---
        const CHAPTER_REGEX = /^(?:Chương|Hồi|Quyển|Phần|Tiết|Tập|Phiên\s*ngoại|Ngoại\s*truyện|Chapter)\s*[\dIVXLCDM\-]+.*/i;

        function detectChapterTitleFromParagraphs(paragraphs, htmlDoc, fallbackTitle) {
            // Cách 1: Quét 10 đoạn văn đầu tiên tìm tên chương
            for (let i = 0; i < Math.min(10, paragraphs.length); i++) {
                const line = paragraphs[i].trim();
                if (CHAPTER_REGEX.test(line)) return line.substring(0, 75);
            }
            // Cách 2: Tìm các thẻ H1, H2, class .title (Không dùng thẻ <title> để tránh lỗi Unknown)
            if (htmlDoc) {
                const headings = htmlDoc.querySelectorAll("h1, h2, h3, .chapter-title, .title");
                for (let h of headings) {
                    const t = h.textContent.replace(/\s+/g, ' ').trim();
                    // Loại bỏ triệt để các tiêu đề rác như unknown, untitled, mục lục...
                    if (t && !/^(unknown|untitled|chương mới|mục lục|cover|title page)$/i.test(t)) {
                        return t.substring(0, 75);
                    }
                }
            }
            return fallbackTitle || (paragraphs.length > 0 ? paragraphs[0].substring(0, 60) : "Chương không tên");
        }

        function extractParagraphsFromHtml(htmlContent, fallbackTitle) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlContent, "text/html");
            doc.querySelectorAll("script, style, nav").forEach(el => el.remove());
            doc.querySelectorAll("br").forEach(br => br.replaceWith("\n"));
            doc.querySelectorAll("p, div, h1, h2, h3, h4, li, blockquote").forEach(el => {
                el.appendChild(doc.createTextNode("\n"));
            });
            const rawText = doc.body ? doc.body.textContent : doc.textContent;
            const paragraphs = processRawTextToChunks(rawText);
            const title = detectChapterTitleFromParagraphs(paragraphs, doc, fallbackTitle);
            return { title, paragraphs };
        }

        function processRawTextToChunks(rawText) {
            const rawLines = rawText.split(/\r?\n/);
            const mergedLines = [];
            const validCharRegex = /[a-zA-Z0-9àáảãạăắằẳẵặâấầẩẫậèéẻẽẹêếềểễệìíỉĩịòóỏõọôốồổỗộơớờởỡợùúủũụưứừửữựỳýỷỹỵđĐ]/;

            for (let line of rawLines) {
                let trimmed = line.replace(/\s+/g, ' ').trim();
                if (!trimmed || /^(unknown|untitled)$/i.test(trimmed) || !validCharRegex.test(trimmed)) continue;

                if (mergedLines.length > 0) {
                    const prev = mergedLines[mergedLines.length - 1];
                    if (!/[.!?;:”"']$/.test(prev) && !CHAPTER_REGEX.test(trimmed)) {
                        mergedLines[mergedLines.length - 1] = prev + " " + trimmed;
                        continue;
                    }
                }
                mergedLines.push(trimmed);
            }
            return mergedLines;
        }

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files.item(0);
            if (!file) return;

            status.textContent = `⏳ Đang phân tích chuẩn xác...`;
            try {
                chapters = [];
                if (file.name.toLowerCase().endsWith('.txt')) {
                    const text = await file.text();
                    const splits = text.split(/(?=^(?:Chương|Hồi|Quyển|Phần|Tiết|Chapter)\s*[\dIVXLCDM]+)/im);
                    if (splits.length <= 1) {
                        const paras = processRawTextToChunks(text);
                        chapters.push({
                            title: detectChapterTitleFromParagraphs(paras, null, "Toàn bộ nội dung"),
                            paragraphs: paras
                        });
                    } else {
                        splits.forEach((content, idx) => {
                            if (content.trim()) {
                                const paras = processRawTextToChunks(content);
                                if (paras.length > 0) {
                                    chapters.push({
                                        title: detectChapterTitleFromParagraphs(paras, null, `Chương ${idx + 1}`),
                                        paragraphs: paras
                                    });
                                }
                            }
                        });
                    }
                } else if (file.name.toLowerCase().endsWith('.epub')) {
                    const zip = await JSZip.loadAsync(file);
                    
                    // Lọc và sắp xếp trực tiếp các file html trong EPUB
                    const spinePaths = Object.keys(zip.files)
                        .filter(k => /\.(x?html|htm)$/i.test(k) && !/(cover|titlepage|toc|nav)\.(x?html|htm)$/i.test(k))
                        .sort((a, b) => a.localeCompare(b, 'vi', { numeric: true, sensitivity: 'base' }));

                    for (let i = 0; i < spinePaths.length; i++) {
                        const pathKey = spinePaths[i];
                        const fileInZip = zip.file(pathKey);
                        if (fileInZip) {
                            const htmlContent = await fileInZip.async("text");
                            const cleanFileName = pathKey.split('/').pop().replace(/\.(x?html|htm)$/i, '');
                            const fallbackTitle = CHAPTER_REGEX.test(cleanFileName) ? cleanFileName : `Chương ${chapters.length + 1}`;

                            // Đưa vào bộ trích xuất thông minh để chặn Unknown
                            const extracted = extractParagraphsFromHtml(htmlContent, fallbackTitle);
                            if (extracted.paragraphs.length > 0) {
                                chapters.push(extracted);
                            }
                        }
                    }
                }

                if (chapters.length === 0) throw new Error("Không tìm thấy nội dung trong file.");

                chapterSelect.innerHTML = "";
                chapters.forEach((chap, idx) => {
                    const opt = document.createElement("option");
                    opt.value = idx;
                    opt.textContent = chap.title;
                    chapterSelect.appendChild(opt);
                });
                document.getElementById("chapterBar").style.display = "flex";

                renderChapter(0, 0);
                status.textContent = `✅ Đã phân tích xong ${chapters.length} chương! Không còn lỗi Unknown.`;
            } catch (err) {
                status.textContent = `❌ Lỗi đọc file: ${err.message}`;
            }
        });

        function onChapterChange() {
            stopSpeech();
            const selectedIdx = parseInt(chapterSelect.value, 10);
            renderChapter(selectedIdx, 0);
            status.textContent = `📖 Đã chuyển sang: ${chapters[selectedIdx].title}`;
        }

        function renderChapter(chapterIdx, startChunk = 0) {
            currentChapterIndex = chapterIdx;
            const chap = chapters[currentChapterIndex];
            if (!chap) return;

            chunks = chap.paragraphs;
            currentChunkIndex = Math.min(startChunk, Math.max(0, chunks.length - 1));

            storyContainer.innerHTML = chunks.map((text, idx) => {
                return `<p id="para-${idx}" onclick="jumpToChunk(${idx})">${text}</p>`;
            }).join('');

            highlightParagraph(currentChunkIndex);
        }

        function toggleSpeechPlay() {
            if (isSpeaking) {
                stopSpeech("⏸ Đã tạm dừng.");
            } else {
                startSpeechPlay(currentChunkIndex);
            }
        }

        function stopSpeech(msg = "⏹ Đã dừng.") {
            isSpeaking = false;
            silentAudio.pause();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            playToggleBtn.innerHTML = "🔊 Nghe trang (Instant Play)";
            if (msg) status.textContent = msg;
        }

        function jumpToChunk(idx) {
            stopSpeech();
            currentChunkIndex = idx;
            startSpeechPlay(currentChunkIndex);
        }

        function startSpeechPlay(startIndex) {
            if (chunks.length === 0) return;

            silentAudio.play().catch(() => {});
            isSpeaking = true;
            playToggleBtn.innerHTML = "■ Dừng đọc (Đang phát)";
            currentChunkIndex = startIndex;

            updateMediaSession();
            playBrowserTTS(currentChunkIndex);
        }

        function updateMediaSession() {
            if ('mediaSession' in navigator && chapters[currentChapterIndex]) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: chapters[currentChapterIndex].title,
                    artist: `Đoạn ${currentChunkIndex + 1}/${chunks.length}`,
                    album: "AI Story Reader"
                });
                navigator.mediaSession.playbackState = "playing";
                navigator.mediaSession.setActionHandler('play', () => startSpeechPlay(currentChunkIndex));
                navigator.mediaSession.setActionHandler('pause', () => stopSpeech());
            }
        }

        function playBrowserTTS(idx) {
            if (!isSpeaking || idx >= chunks.length) {
                if (idx >= chunks.length) {
                    if (currentChapterIndex + 1 < chapters.length) {
                        currentChapterIndex++;
                        chapterSelect.value = currentChapterIndex;
                        renderChapter(currentChapterIndex, 0);
                        playBrowserTTS(0);
                        return;
                    } else {
                        stopSpeech("✅ Đã đọc xong toàn bộ truyện!");
                    }
                }
                return;
            }

            currentChunkIndex = idx;
            highlightParagraph(idx);
            status.textContent = `🔊 [${chapters[currentChapterIndex].title}] - Đoạn ${idx + 1}/${chunks.length}`;
            updateMediaSession();

            const text = chunks[idx];
            const utterance = new SpeechSynthesisUtterance(text);
            
            // Dòng ép nạp Voice Siri xịn từ danh sách đã lọc
            if (voices[selectedVoiceIndex]) {
                utterance.voice = voices[selectedVoiceIndex];
            }
            
            utterance.lang = 'vi-VN';
            utterance.rate = parseFloat(speedSelect.value);

            utterance.onend = () => {
                if (isSpeaking) playBrowserTTS(currentChunkIndex + 1);
            };
            utterance.onerror = () => {
                if (isSpeaking) playBrowserTTS(currentChunkIndex + 1);
            };

            window.speechSynthesis.speak(utterance);
        }

        function highlightParagraph(index) {
            document.querySelectorAll('#storyContainer p.active-chunk').forEach(p => p.classList.remove('active-chunk'));
            chunkCounter.textContent = chunks.length > 0 ? `${index + 1} / ${chunks.length}` : "0 / 0";
            const activePara = document.getElementById(`para-${index}`);
            if (activePara) {
                activePara.classList.add('active-chunk');
                if (document.visibilityState === 'visible') {
                    activePara.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }
    </script>
</body>
</html>
