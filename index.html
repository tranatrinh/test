<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đọc Truyện AI - Chạy Trực Tiếp (Không Server)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-hover: #273549;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --active-bg: rgba(59, 130, 246, 0.24);
      --cached: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 115px;
      line-height: 1.65;
    }
    header {
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .brand { font-weight: 700; font-size: 16px; }
    .status-bar { font-size: 13px; color: #38bdf8; }
    .container { max-width: 860px; margin: 16px auto; padding: 0 14px; }
    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    input, select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #334155; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .chapter-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      background: var(--surface);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .chapter-nav select { flex: 1; min-width: 0; }
    .chunk-list { display: flex; flex-direction: column; gap: 10px; }
    .chunk-item {
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 17px;
      line-height: 1.75;
      position: relative;
    }
    .chunk-item:hover { background: var(--surface-hover); border-color: #475569; }
    .chunk-item.active {
      background: var(--active-bg);
      border-color: var(--primary);
    }
    .chunk-item.cached::after {
      content: "●";
      color: var(--cached);
      font-size: 10px;
      position: absolute;
      top: 8px;
      right: 10px;
    }
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 17, 32, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      z-index: 40;
    }
    .player-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .player-controls { display: flex; align-items: center; gap: 8px; }
    .player-info { font-size: 13px; color: var(--muted); }
    audio { height: 34px; max-width: 240px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">📖 Đọc Truyện Trực Tiếp (EPUB / TXT)</div>
    <div class="status-bar" id="statusBar">Dán API Key và chọn sách để nghe ngay</div>
  </header>

  <div class="container">
    <!-- THANH CÔNG CỤ -->
    <div class="toolbar">
      <div>
        <label>🔑 Gemini API Key (AI Studio):</label>
        <input type="password" id="apiKeyInput" placeholder="Dán API Key vào đây..." />
      </div>
      <div>
        <label>📂 Mở file sách (.epub / .txt):</label>
        <input type="file" id="fileInput" accept=".epub,.txt,application/epub+zip,text/plain" />
      </div>
      <div>
        <label>🎙 Giọng đọc Gemini:</label>
        <select id="voiceSelect">
          <option value="Aoede">Aoede (Nữ - Tự nhiên)</option>
          <option value="Sulafat">Sulafat (Nữ - Ấm áp)</option>
          <option value="Kore">Kore (Nữ - Rõ ràng)</option>
          <option value="Charon">Charon (Nam - Trầm ấm)</option>
          <option value="Orus">Orus (Nam - Uy nghiêm)</option>
          <option value="Puck">Puck (Nam - Nhanh nhẹn)</option>
        </select>
      </div>
      <div>
        <label>⚡ Tốc độ phát:</label>
        <select id="speedSelect">
          <option value="1">1.0x (Chuẩn)</option>
          <option value="1.15" selected>1.15x (Mượt)</option>
          <option value="1.25">1.25x (Nhanh)</option>
          <option value="1.5">1.5x (Rất nhanh)</option>
        </select>
      </div>
    </div>

    <!-- CHỌN CHƯƠNG -->
    <div class="chapter-nav">
      <button class="secondary" onclick="changeChapter(-1)">◀</button>
      <select id="chapterSelect" onchange="selectChapter(parseInt(this.value, 10), 0, isPlaying)"></select>
      <button class="secondary" onclick="changeChapter(1)">▶</button>
    </div>

    <!-- NỘI DUNG TRUYỆN -->
    <div class="chunk-list" id="chunkList"></div>
  </div>

  <!-- THANH PHÁT ÂM THANH -->
  <div class="player-bar">
    <div class="player-inner">
      <div class="player-controls">
        <button class="secondary" onclick="prevChunk()">⏮</button>
        <button id="playPauseBtn" onclick="togglePlay()">▶ Phát ngay</button>
        <button class="secondary" onclick="nextChunk()">⏭</button>
      </div>
      <div class="player-info" id="playerInfo">Chưa mở sách</div>
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <script>
    const DB_NAME = "LocalStoryReaderDB";
    const STORE_NAME = "books";

    let currentBook = null;
    let currentChapterIdx = 0;
    let chunks = [];
    let currentChunkIdx = 0;
    let isPlaying = false;

    const audioCache = new Map();
    const pendingFetches = new Map();

    const statusBar = document.getElementById("statusBar");
    const playerInfo = document.getElementById("playerInfo");
    const audioPlayer = document.getElementById("audioPlayer");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const voiceSelect = document.getElementById("voiceSelect");
    const speedSelect = document.getElementById("speedSelect");

    apiKeyInput.value = localStorage.getItem("sr_direct_gemini_key") || "";
    voiceSelect.value = localStorage.getItem("sr_voice") || "Aoede";
    speedSelect.value = localStorage.getItem("sr_speed") || "1.15";

    apiKeyInput.addEventListener("input", () => {
      localStorage.setItem("sr_direct_gemini_key", apiKeyInput.value.trim());
    });
    voiceSelect.addEventListener("change", () => {
      localStorage.setItem("sr_voice", voiceSelect.value);
      clearAudioCache();
    });
    speedSelect.addEventListener("change", () => {
      localStorage.setItem("sr_speed", speedSelect.value);
      audioPlayer.playbackRate = parseFloat(speedSelect.value);
    });

    // =================================================================
    // LƯU SÁCH & TIẾN ĐỘ TRỰC TIẾP TRÊN BỘ NHỚ MÁY (INDEXEDDB)
    // =================================================================
    function openLocalDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME, { keyPath: "id" });
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveBookToDevice(book) {
      const db = await openLocalDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(book);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadBookFromDevice(id) {
      const db = await openLocalDB();
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const req = tx.objectStore(STORE_NAME).get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      });
    }

    // =================================================================
    // GIẢI NÉN EPUB / TXT TRỰC TIẾP TRÊN TRÌNH DUYỆT
    // =================================================================
    function resolveZipPath(baseDir, href) {
      const cleanHref = decodeURIComponent(href.split("#")[0]);
      if (!baseDir) return cleanHref;
      const stack = [];
      for (const p of (baseDir + "/" + cleanHref).split("/")) {
        if (!p || p === ".") continue;
        if (p === "..") stack.pop();
        else stack.push(p);
      }
      return stack.join("/");
    }

    function extractTextFromHtml(htmlString) {
      const doc = new DOMParser().parseFromString(htmlString, "text/html");
      doc.querySelectorAll("script, style, nav").forEach((el) => el.remove());
      const heading = doc.querySelector("h1, h2, h3, title");
      const headingText = heading ? heading.textContent.replace(/\s+/g, " ").trim() : "";

      const blocks = doc.querySelectorAll("p, div, h1, h2, h3, h4, li");
      const lines = [];
      if (blocks.length > 0) {
        blocks.forEach((b) => {
          if (b.tagName === "DIV" && b.querySelector("p, div, h1, h2, h3")) return;
          const t = b.textContent.replace(/\s+/g, " ").trim();
          if (t) lines.push(t);
        });
      } else {
        (doc.body?.innerText || "").split(/\r?\n/).forEach((l) => {
          if (l.trim()) lines.push(l.trim());
        });
      }
      return { headingText, text: lines.join("\n") };
    }

    async function parseEpubFile(file) {
      const zip = await JSZip.loadAsync(await file.arrayBuffer());
      const parser = new DOMParser();

      const containerXml = await zip.file("META-INF/container.xml").async("string");
      const opfPath = parser.parseFromString(containerXml, "application/xml")
        .querySelector("rootfile")?.getAttribute("full-path");
      const opfDir = opfPath.includes("/") ? opfPath.substring(0, opfPath.lastIndexOf("/")) : "";
      const opfDoc = parser.parseFromString(await zip.file(opfPath).async("string"), "application/xml");

      const bookTitle = opfDoc.querySelector("metadata title, dc\\:title")?.textContent?.trim() || file.name.replace(/\.epub$/i, "");
      const manifest = {};
      opfDoc.querySelectorAll("manifest > item").forEach((item) => {
        manifest[item.getAttribute("id")] = {
          href: item.getAttribute("href"),
          mediaType: item.getAttribute("media-type") || ""
        };
      });

      const tocTitles = {};
      const ncxItem = Object.values(manifest).find((m) => m.mediaType.includes("ncx") || m.href.endsWith(".ncx"));
      if (ncxItem) {
        const ncxPath = resolveZipPath(opfDir, ncxItem.href);
        const ncxFile = zip.file(ncxPath);
        if (ncxFile) {
          const ncxDir = ncxPath.includes("/") ? ncxPath.substring(0, ncxPath.lastIndexOf("/")) : "";
          const ncxDoc = parser.parseFromString(await ncxFile.async("string"), "application/xml");
          ncxDoc.querySelectorAll("navPoint").forEach((np) => {
            const label = np.querySelector("navLabel > text")?.textContent?.replace(/\s+/g, " ").trim();
            const src = np.querySelector("content")?.getAttribute("src");
            if (label && src) {
              const target = resolveZipPath(ncxDir, src);
              if (!tocTitles[target]) tocTitles[target] = label;
            }
          });
        }
      }

      const chapters = [];
      for (const ref of opfDoc.querySelectorAll("spine > itemref")) {
        const item = manifest[ref.getAttribute("idref")];
        if (!item || (!item.mediaType.includes("html") && !/\.(x?html?|htm)$/i.test(item.href))) continue;
        const fullPath = resolveZipPath(opfDir, item.href);
        const entry = zip.file(fullPath);
        if (!entry) continue;

        const { headingText, text } = extractTextFromHtml(await entry.async("string"));
        if (text.trim().length < 25) continue;
        chapters.push({
          title: tocTitles[fullPath] || headingText || `Chương ${chapters.length + 1}`,
          content: text.trim()
        });
      }
      return { title: bookTitle, chapters };
    }

    function parseTxtFile(rawText, fallbackTitle) {
      const chapters = [];
      let currentTitle = fallbackTitle;
      let buffer = [];
      const chapterRegex = /^(chương|hồi|quyển|chapter|part)\s+\d+.*$/i;

      for (const line of rawText.split(/\r?\n/)) {
        const trimmed = line.trim();
        if (chapterRegex.test(trimmed) && trimmed.length < 120) {
          if (buffer.join("\n").trim()) chapters.push({ title: currentTitle, content: buffer.join("\n").trim() });
          currentTitle = trimmed;
          buffer = [];
        } else {
          buffer.push(line);
        }
      }
      if (buffer.join("\n").trim()) chapters.push({ title: currentTitle, content: buffer.join("\n").trim() });
      return chapters.length ? chapters : [{ title: fallbackTitle, content: rawText.trim() }];
    }

    document.getElementById("fileInput").addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      statusBar.textContent = "⏳ Đang mở sách...";
      try {
        let bookData;
        if (file.name.toLowerCase().endsWith(".epub")) {
          bookData = await parseEpubFile(file);
        } else {
          const text = await file.text();
          const title = file.name.replace(/\.txt$/i, "");
          bookData = { title, chapters: parseTxtFile(text, title) };
        }

        if (!bookData.chapters.length) throw new Error("Không tìm thấy nội dung truyện!");

        currentBook = {
          id: "active_book",
          title: bookData.title,
          chapters: bookData.chapters,
          lastChapter: 0,
          lastChunk: 0
        };
        await saveBookToDevice(currentBook);
        renderBook(0, 0);
        statusBar.textContent = `✅ Đã mở "${currentBook.title}" (${currentBook.chapters.length} chương)`;
      } catch (err) {
        alert("Lỗi mở file: " + err.message);
        statusBar.textContent = "❌ Lỗi đọc file";
      }
    });

    // =================================================================
    // CHIA ĐOẠN & GỌI TRỰC TIẾP GEMINI API (KHÔNG QUA SERVER TRUNG GIAN)
    // =================================================================
    function splitChapterToChunks(rawText, maxLen = 550) {
      const result = [];
      for (const p of rawText.split(/\n+/).map((x) => x.trim()).filter(Boolean)) {
        if (p.length <= maxLen) {
          result.push(p);
          continue;
        }
        const sentences = p.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [p];
        let buf = "";
        for (const s of sentences) {
          if ((buf + " " + s).trim().length <= maxLen) {
            buf = (buf + " " + s).trim();
          } else {
            if (buf) result.push(buf);
            buf = s.trim();
          }
        }
        if (buf) result.push(buf);
      }
      return result;
    }

    function renderBook(chapIdx, chunkIdx) {
      if (!currentBook?.chapters?.length) return;
      const chapSelect = document.getElementById("chapterSelect");
      chapSelect.innerHTML = "";
      currentBook.chapters.forEach((c, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = c.title;
        chapSelect.appendChild(opt);
      });
      selectChapter(Math.min(Math.max(0, chapIdx), currentBook.chapters.length - 1), chunkIdx, false);
    }

    function selectChapter(chapIdx, startChunkIdx = 0, autoPlay = true) {
      if (!currentBook || chapIdx < 0 || chapIdx >= currentBook.chapters.length) return;
      clearAudioCache();
      currentChapterIdx = chapIdx;
      document.getElementById("chapterSelect").value = chapIdx;

      chunks = splitChapterToChunks(currentBook.chapters[chapIdx].content, 550);
      currentChunkIdx = Math.min(Math.max(0, startChunkIdx), Math.max(0, chunks.length - 1));

      const listEl = document.getElementById("chunkList");
      listEl.innerHTML = "";
      chunks.forEach((text, idx) => {
        const div = document.createElement("div");
        div.className = "chunk-item" + (idx === currentChunkIdx ? " active" : "");
        div.id = `chunk-${idx}`;
        div.textContent = text;
        div.onclick = () => playFromIndex(idx);
        listEl.appendChild(div);
      });

      updateHighlight();
      preloadChunk(currentChunkIdx);
      preloadChunk(currentChunkIdx + 1);
      if (autoPlay) playFromIndex(currentChunkIdx);
    }

    function changeChapter(delta) {
      if (!currentBook) return;
      const target = currentChapterIdx + delta;
      if (target >= 0 && target < currentBook.chapters.length) {
        selectChapter(target, 0, isPlaying);
      }
    }

    function getCacheKey(chapIdx, chunkIdx) {
      return `${voiceSelect.value}:${chapIdx}:${chunkIdx}`;
    }

    function clearAudioCache() {
      for (const url of audioCache.values()) URL.revokeObjectURL(url);
      audioCache.clear();
      pendingFetches.clear();
      updateHighlight();
    }

    function updateHighlight() {
      document.querySelectorAll(".chunk-item").forEach((el, idx) => {
        el.classList.toggle("active", idx === currentChunkIdx);
        el.classList.toggle("cached", audioCache.has(getCacheKey(currentChapterIdx, idx)));
      });
      playerInfo.textContent = currentBook
        ? `Ch.${currentChapterIdx + 1}/${currentBook.chapters.length} • Đoạn ${currentChunkIdx + 1}/${chunks.length}`
        : "Chưa mở sách";

      const activeEl = document.getElementById(`chunk-${currentChunkIdx}`);
      if (activeEl) activeEl.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    async function fetchAudioDirectFromGemini(text) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) throw new Error("Vui lòng dán Gemini API Key vào ô trên cùng!");

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash-lite-tts:generateContent?key=${encodeURIComponent(apiKey)}`;
      const resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [
            {
              role: "user",
              parts: [
                {
                  text,
                  speech_metadata: {
                    style: "Giọng kể chuyện truyền cảm, tự nhiên, ngắt nghỉ đúng nhịp"
                  }
                }
              ]
            }
          ],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: { voiceName: voiceSelect.value }
              }
            }
          }
        })
      });

      const data = await resp.json();
      if (!resp.ok) {
        throw new Error(data.error?.message || `HTTP ${resp.status}`);
      }

      const audioPart = data.candidates?.[0]?.content?.parts?.find((p) => p.inlineData);
      if (!audioPart?.inlineData?.data) {
        throw new Error("Gemini không trả về dữ liệu âm thanh");
      }

      const byteChars = atob(audioPart.inlineData.data);
      const byteArray = new Uint8Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) {
        byteArray[i] = byteChars.charCodeAt(i);
      }
      const blob = new Blob([byteArray], { type: audioPart.inlineData.mimeType || "audio/wav" });
      return URL.createObjectURL(blob);
    }

    async function preloadChunk(chunkIdx) {
      if (chunkIdx < 0 || chunkIdx >= chunks.length) return null;
      if (!apiKeyInput.value.trim()) return null;

      const chapSnap = currentChapterIdx;
      const key = getCacheKey(chapSnap, chunkIdx);
      if (audioCache.has(key)) return audioCache.get(key);
      if (pendingFetches.has(key)) return pendingFetches.get(key);

      const promise = fetchAudioDirectFromGemini(chunks[chunkIdx])
        .then((url) => {
          audioCache.set(key, url);
          pendingFetches.delete(key);
          if (currentChapterIdx === chapSnap) updateHighlight();
          return url;
        })
        .catch((err) => {
          pendingFetches.delete(key);
          throw err;
        });

      pendingFetches.set(key, promise);
      return promise;
    }

    async function playFromIndex(idx) {
      if (idx < 0 || idx >= chunks.length) {
        if (currentBook && currentChapterIdx + 1 < currentBook.chapters.length) {
          selectChapter(currentChapterIdx + 1, 0, true);
          return;
        }
        isPlaying = false;
        document.getElementById("playPauseBtn").textContent = "▶ Phát ngay";
        statusBar.textContent = "✅ Đã đọc hết sách.";
        return;
      }

      currentChunkIdx = idx;
      isPlaying = true;
      document.getElementById("playPauseBtn").textContent = "⏸ Tạm dừng";
      updateHighlight();

      if (currentBook) {
        currentBook.lastChapter = currentChapterIdx;
        currentBook.lastChunk = currentChunkIdx;
        saveBookToDevice(currentBook).catch(() => {});
      }

      const isCached = audioCache.has(getCacheKey(currentChapterIdx, idx));
      statusBar.textContent = isCached
        ? `⚡ Đang phát ngay đoạn ${idx + 1}...`
        : `⏳ Đang tạo giọng đoạn ${idx + 1}...`;

      try {
        const blobUrl = await preloadChunk(idx);
        if (currentChunkIdx !== idx || !isPlaying) return;

        audioPlayer.src = blobUrl;
        audioPlayer.playbackRate = parseFloat(speedSelect.value);
        await audioPlayer.play();
        statusBar.textContent = `🔊 ${currentBook?.chapters[currentChapterIdx]?.title || ""} (${idx + 1}/${chunks.length})`;

        preloadChunk(idx + 1);
        preloadChunk(idx + 2);
      } catch (err) {
        statusBar.textContent = `❌ Lỗi: ${err.message}`;
        isPlaying = false;
        document.getElementById("playPauseBtn").textContent = "▶ Phát ngay";
      }
    }

    audioPlayer.addEventListener("ended", () => {
      if (isPlaying) playFromIndex(currentChunkIdx + 1);
    });

    function togglePlay() {
      if (!chunks.length) {
        document.getElementById("fileInput").click();
        return;
      }
      if (isPlaying) {
        isPlaying = false;
        audioPlayer.pause();
        document.getElementById("playPauseBtn").textContent = "▶ Tiếp tục";
        statusBar.textContent = "⏸ Đã tạm dừng.";
      } else {
        if (audioPlayer.src && audioPlayer.paused && audioPlayer.currentTime > 0) {
          isPlaying = true;
          audioPlayer.play();
          document.getElementById("playPauseBtn").textContent = "⏸ Tạm dừng";
        } else {
          playFromIndex(currentChunkIdx);
        }
      }
    }

    function prevChunk() {
      if (currentChunkIdx > 0) playFromIndex(currentChunkIdx - 1);
      else if (currentChapterIdx > 0) selectChapter(currentChapterIdx - 1, 0, true);
    }

    function nextChunk() {
      playFromIndex(currentChunkIdx + 1);
    }

    (async function init() {
      const saved = await loadBookFromDevice("active_book");
      if (saved?.chapters?.length) {
        currentBook = saved;
        renderBook(saved.lastChapter || 0, saved.lastChunk || 0);
        statusBar.textContent = `📖 Đã khôi phục: ${saved.title}`;
      }
    })();
  </script>
</body>
</html>
