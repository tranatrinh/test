<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Đọc Truyện AI - Gemini 3.8 TTS</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --active-bg: rgba(59, 130, 246, 0.22);
      --cached-dot: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 110px;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 17px; margin: 0; }
    .container { max-width: 820px; margin: 20px auto; padding: 0 16px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    input, select, textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 14px;
    }
    textarea { min-height: 110px; resize: vertical; margin-top: 8px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #334155; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .chunk-list { display: flex; flex-direction: column; gap: 8px; }
    .chunk-item {
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 17px;
      line-height: 1.65;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
    }
    .chunk-item:hover { border-color: #475569; }
    .chunk-item.active {
      background: var(--active-bg);
      border-color: var(--primary);
    }
    .chunk-item.cached::after {
      content: "●";
      color: var(--cached-dot);
      font-size: 10px;
      position: absolute;
      top: 8px;
      right: 10px;
      title: "Đã tải sẵn trong RAM";
    }
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0b1120;
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      z-index: 30;
    }
    .player-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }
    .status-text { font-size: 13px; color: #38bdf8; }
  </style>
</head>
<body>
  <header>
    <h1>📖 Trình Đọc Truyện AI (Gemini 3.8 TTS)</h1>
    <div class="status-text" id="statusText">Sẵn sàng</div>
  </header>

  <div class="container">
    <!-- CẤU HÌNH KẾT NỐI -->
    <div class="panel">
      <div class="grid-3">
        <div>
          <label>Cloudflare Worker URL (Khuyên dùng):</label>
          <input type="text" id="workerUrl" placeholder="https://story-tts.xxx.workers.dev" />
        </div>
        <div>
          <label>Hoặc Gemini API Key (Test trực tiếp):</label>
          <input type="password" id="directApiKey" placeholder="AQ.Ab8RN6..." />
        </div>
        <div>
          <label>Giọng đọc:</label>
          <select id="voiceSelect">
            <option value="Aoede">🎙 Aoede (Nữ - Tự nhiên)</option>
            <option value="Sulafat">🎙 Sulafat (Nữ - Ấm áp)</option>
            <option value="Kore">🎙 Kore (Nữ - Rõ ràng)</option>
            <option value="Charon">🎙 Charon (Nam - Trầm ấm)</option>
            <option value="Orus">🎙 Orus (Nam - Uy nghiêm)</option>
            <option value="Puck">🎙 Puck (Nam - Nhanh nhẹn)</option>
          </select>
        </div>
      </div>

      <div class="grid-3" style="margin-top: 10px;">
        <div>
          <label>Model Gemini TTS:</label>
          <select id="modelSelect">
            <option value="gemini-3.8-flash-lite-tts" selected>Gemini 3.8 Flash-Lite TTS (Nhanh)</option>
            <option value="gemini-3.8-flash-tts">Gemini 3.8 Flash TTS (Diễn cảm)</option>
          </select>
        </div>
        <div>
          <label>Tốc độ phát (Playback Rate):</label>
          <select id="speedSelect">
            <option value="1">1.0x (Chuẩn)</option>
            <option value="1.15" selected>1.15x (Nghe truyện mượt)</option>
            <option value="1.25">1.25x (Nhanh)</option>
            <option value="1.5">1.5x (Rất nhanh)</option>
          </select>
        </div>
        <div>
          <label>Nạp file truyện (.txt):</label>
          <input type="file" id="fileInput" accept=".txt" />
        </div>
      </div>

      <textarea id="rawInput" placeholder="Dán nội dung chương truyện vào đây rồi bấm 'Nạp nội dung'..."></textarea>
      <div class="btn-row">
        <button onclick="loadTextContent()">📥 Nạp nội dung</button>
        <button class="secondary" onclick="clearAudioCache()">🧹 Xóa bộ nhớ đệm RAM</button>
      </div>
    </div>

    <!-- DANH SÁCH ĐOẠN TRUYỆN (BẤM VÀO ĐOẠN NÀO ĐỌC NGAY ĐOẠN ĐÓ) -->
    <div class="chunk-list" id="chunkList"></div>
  </div>

  <!-- THANH ĐIỀU KHIỂN PHÁT NHẠC CỐ ĐỊNH -->
  <div class="player-bar">
    <div class="player-inner">
      <div class="btn-row" style="margin-top: 0;">
        <button class="secondary" onclick="prevChunk()">⏮ Đoạn trước</button>
        <button id="playPauseBtn" onclick="togglePlay()">▶ Phát</button>
        <button class="secondary" onclick="nextChunk()">⏭ Đoạn sau</button>
      </div>
      <div id="progressInfo" style="font-size: 13px; color: var(--muted);">Đoạn 0 / 0</div>
      <audio id="audioPlayer" controls style="height: 36px; max-width: 280px;"></audio>
    </div>
  </div>

  <script>
    // =================================================================
    // KHỞI TẠO BIẾN & BỘ NHỚ ĐỆM RAM (PRELOAD CACHE)
    // =================================================================
    let chunks = [];
    let currentIndex = 0;
    let isPlaying = false;
    const audioCache = new Map();     // key: `${voice}:${model}:${index}` -> blobUrl
    const pendingFetches = new Map(); // Tránh gọi trùng 1 đoạn đang tải

    const workerInput = document.getElementById("workerUrl");
    const keyInput = document.getElementById("directApiKey");
    const voiceSelect = document.getElementById("voiceSelect");
    const modelSelect = document.getElementById("modelSelect");
    const speedSelect = document.getElementById("speedSelect");
    const audioPlayer = document.getElementById("audioPlayer");
    const statusText = document.getElementById("statusText");

    // Khôi phục cấu hình đã lưu
    workerInput.value = localStorage.getItem("sr_worker_url") || "";
    keyInput.value = localStorage.getItem("sr_gemini_key") || "AQ.Ab8RN6LHdvT2d8LmaOfJg4ICbLF98Qv0jAsUhr_jYhaD4gCqeA";
    voiceSelect.value = localStorage.getItem("sr_voice") || "Aoede";

    workerInput.addEventListener("input", () => localStorage.setItem("sr_worker_url", workerInput.value.trim()));
    keyInput.addEventListener("input", () => localStorage.setItem("sr_gemini_key", keyInput.value.trim()));
    voiceSelect.addEventListener("change", () => {
      localStorage.setItem("sr_voice", voiceSelect.value);
      clearAudioCache();
    });
    modelSelect.addEventListener("change", clearAudioCache);
    speedSelect.addEventListener("change", () => {
      audioPlayer.playbackRate = parseFloat(speedSelect.value);
    });

    // Đọc file .txt từ máy
    document.getElementById("fileInput").addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById("rawInput").value = ev.target.result;
        loadTextContent();
      };
      reader.readAsText(file, "UTF-8");
    });

    // Chia văn bản dài thành các đoạn vừa phải (~450-650 ký tự) để đọc mượt và tiết kiệm request
    function splitStoryToChunks(rawText, maxLen = 550) {
      const paragraphs = rawText.split(/\n+/).map(p => p.trim()).filter(Boolean);
      const result = [];
      for (const p of paragraphs) {
        if (p.length <= maxLen) {
          result.push(p);
          continue;
        }
        const sentences = p.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [p];
        let buf = "";
        for (const s of sentences) {
          if ((buf + " " + s).trim().length <= maxLen) {
            buf = (buf + " " + s).trim();
          } else {
            if (buf) result.push(buf);
            buf = s.trim();
          }
        }
        if (buf) result.push(buf);
      }
      return result;
    }

    function loadTextContent() {
      const raw = document.getElementById("rawInput").value.trim();
      if (!raw) return;
      clearAudioCache();
      chunks = splitStoryToChunks(raw, 550);
      currentIndex = 0;
      renderChunks();
      statusText.textContent = `Đã nạp ${chunks.length} đoạn. Đang tải trước đoạn đầu...`;
      // Tải trước ngay 2 đoạn đầu tiên vào RAM
      preloadChunk(0);
      preloadChunk(1);
    }

    function renderChunks() {
      const listEl = document.getElementById("chunkList");
      listEl.innerHTML = "";
      chunks.forEach((text, idx) => {
        const div = document.createElement("div");
        div.className = "chunk-item" + (idx === currentIndex ? " active" : "");
        div.id = `chunk-${idx}`;
        div.textContent = text;
        div.onclick = () => playFromIndex(idx);
        listEl.appendChild(div);
      });
      updateHighlight();
    }

    function updateHighlight() {
      document.querySelectorAll(".chunk-item").forEach((el, idx) => {
        el.classList.toggle("active", idx === currentIndex);
        const key = getCacheKey(idx);
        el.classList.toggle("cached", audioCache.has(key));
      });
      document.getElementById("progressInfo").textContent = `Đoạn ${chunks.length ? currentIndex + 1 : 0} / ${chunks.length}`;
      const activeEl = document.getElementById(`chunk-${currentIndex}`);
      if (activeEl) activeEl.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function getCacheKey(idx) {
      return `${voiceSelect.value}:${modelSelect.value}:${idx}`;
    }

    function clearAudioCache() {
      for (const url of audioCache.values()) {
        URL.revokeObjectURL(url);
      }
      audioCache.clear();
      pendingFetches.clear();
      updateHighlight();
    }

    // =================================================================
    // HÀM GỌI API GEMINI TTS (QUA WORKER HOẶC TRỰC TIẾP)
    // =================================================================
    async function fetchTtsAudioBlobUrl(text) {
      const workerUrl = workerInput.value.trim().replace(/\/$/, "");
      const apiKey = keyInput.value.trim();
      const voice = voiceSelect.value;
      const model = modelSelect.value;
      const style = "Giọng kể chuyện truyền cảm, tự nhiên, ngắt nghỉ đúng nhịp";

      // Ưu tiên gọi qua Cloudflare Worker nếu đã điền URL
      if (workerUrl) {
        const resp = await fetch(`${workerUrl}/tts`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, voice, model, style })
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || `Worker HTTP ${resp.status}`);
        }
        const blob = await resp.blob();
        return URL.createObjectURL(blob);
      }

      // Nếu chưa có Worker, gọi trực tiếp Gemini API để test
      if (!apiKey) throw new Error("Chưa nhập Worker URL hoặc Gemini API Key!");
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
      const resp = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ role: "user", parts: [{ text, speech_metadata: { style } }] }],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } }
          }
        })
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error?.message || `Gemini HTTP ${resp.status}`);

      const audioPart = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
      if (!audioPart?.inlineData?.data) throw new Error("Không có dữ liệu âm thanh trả về");

      const byteChars = atob(audioPart.inlineData.data);
      const byteArray = new Uint8Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteArray[i] = byteChars.charCodeAt(i);
      const blob = new Blob([byteArray], { type: audioPart.inlineData.mimeType || "audio/wav" });
      return URL.createObjectURL(blob);
    }

    async function preloadChunk(idx) {
      if (idx < 0 || idx >= chunks.length) return null;
      const key = getCacheKey(idx);
      if (audioCache.has(key)) return audioCache.get(key);
      if (pendingFetches.has(key)) return pendingFetches.get(key);

      const promise = fetchTtsAudioBlobUrl(chunks[idx])
        .then((blobUrl) => {
          audioCache.set(key, blobUrl);
          pendingFetches.delete(key);
          updateHighlight();
          return blobUrl;
        })
        .catch((err) => {
          pendingFetches.delete(key);
          throw err;
        });

      pendingFetches.set(key, promise);
      return promise;
    }

    async function playFromIndex(idx) {
      if (idx < 0 || idx >= chunks.length) {
        isPlaying = false;
        document.getElementById("playPauseBtn").textContent = "▶ Phát";
        statusText.textContent = "Đã đọc hết nội dung.";
        return;
      }

      currentIndex = idx;
      isPlaying = true;
      document.getElementById("playPauseBtn").textContent = "⏸ Tạm dừng";
      updateHighlight();

      const key = getCacheKey(idx);
      const isCached = audioCache.has(key);
      statusText.textContent = isCached
        ? `⚡ Đang phát ngay đoạn ${idx + 1} (Từ RAM)...`
        : `⏳ Đang tạo giọng đoạn ${idx + 1}...`;

      try {
        const blobUrl = await preloadChunk(idx);
        if (currentIndex !== idx || !isPlaying) return;

        audioPlayer.src = blobUrl;
        audioPlayer.playbackRate = parseFloat(speedSelect.value);
        await audioPlayer.play();
        statusText.textContent = `🔊 Đang đọc đoạn ${idx + 1} / ${chunks.length}`;

        // Âm thầm tải trước 2 đoạn tiếp theo vào RAM để chuyển đoạn 0ms
        preloadChunk(idx + 1);
        preloadChunk(idx + 2);
      } catch (err) {
        statusText.textContent = `❌ Lỗi đoạn ${idx + 1}: ${err.message}`;
        isPlaying = false;
        document.getElementById("playPauseBtn").textContent = "▶ Phát";
      }
    }

    audioPlayer.addEventListener("ended", () => {
      if (isPlaying && currentIndex + 1 < chunks.length) {
        playFromIndex(currentIndex + 1);
      } else {
        isPlaying = false;
        document.getElementById("playPauseBtn").textContent = "▶ Phát";
        statusText.textContent = "Hoàn thành.";
      }
    });

    function togglePlay() {
      if (!chunks.length) {
        loadTextContent();
        if (!chunks.length) return;
      }
      if (isPlaying) {
        isPlaying = false;
        audioPlayer.pause();
        document.getElementById("playPauseBtn").textContent = "▶ Tiếp tục";
        statusText.textContent = "Đã tạm dừng.";
      } else {
        if (audioPlayer.src && audioPlayer.paused && audioPlayer.currentTime > 0) {
          isPlaying = true;
          audioPlayer.play();
          document.getElementById("playPauseBtn").textContent = "⏸ Tạm dừng";
        } else {
          playFromIndex(currentIndex);
        }
      }
    }

    function prevChunk() {
      if (currentIndex > 0) playFromIndex(currentIndex - 1);
    }

    function nextChunk() {
      if (currentIndex + 1 < chunks.length) playFromIndex(currentIndex + 1);
    }

    // Nạp sẵn 1 đoạn truyện mẫu để test ngay khi mở trang
    document.getElementById("rawInput").value =
      "Diệp Phàm đứng trên đỉnh Thái Sơn, nhìn chín con rồng khổng lồ kéo theo chiếc quan tài đồng cổ xưa lao thẳng xuống từ bầu trời đêm đầy sao.\n" +
      "Gió núi gào thét, khí thế bàng bạc khiến tất cả mọi người xung quanh đều kinh hãi tột độ. Không ai ngờ rằng truyền thuyết cổ xưa lại hiển hiện ngay trước mắt.\n" +
      "Trong khoảnh khắc chiếc quan tài đồng chấn động, một luồng ánh sáng ngũ sắc bùng phát, bao trùm lấy toàn bộ đỉnh Ngọc Hoàng.";
    loadTextContent();
  </script>
</body>
</html>
