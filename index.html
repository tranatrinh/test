<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Story Reader Pro - Native Browser TTS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #131a2a;
            --surface-2: #1e293b;
            --border: #283548;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.25);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
        }
        header {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
        }
        .brand { font-weight: 700; font-size: 15px; color: var(--accent); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .header-actions { display: flex; align-items: center; gap: 6px; }
        .pill-btn {
            background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
            border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .pill-btn:active { opacity: 0.75; }
        .pill-accent { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.35); }
        .chapter-bar {
            background: #0f1523; padding: 8px 14px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        #chapterSelect {
            flex: 1; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
            border-radius: 8px; padding: 7px 10px; font-size: 13px; outline: none; min-width: 0;
        }
        #storyContainer {
            flex: 1; overflow-y: auto; padding: 18px 16px 32px 16px;
            font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.75; color: #cbd5e1;
            max-width: 780px; width: 100%; margin: 0 auto;
        }
        #storyContainer p {
            margin: 0 0 14px 0; padding: 10px 12px; border-radius: 10px; border-left: 3px solid transparent; cursor: pointer; transition: background 0.2s;
        }
        #storyContainer p.active-chunk { background: rgba(16, 185, 129, 0.15); border-left-color: var(--accent); color: #f8fafc; }
        
        .player-dock {
            background: var(--surface); border-top: 1px solid var(--border);
            padding: 10px 14px calc(12px + env(safe-area-inset-bottom)) 14px;
            display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
        }
        .status-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); gap: 8px; }
        #status { color: #fcd34d; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .dock-select {
            background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
            border-radius: 8px; padding: 7px 8px; font-size: 12px; font-weight: 600; outline: none; max-width: 140px;
        }
        .transport { display: flex; align-items: center; gap: 8px; }
        .ctrl-btn {
            background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 50%;
            width: 38px; height: 38px; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
        }
        .ctrl-btn:active { transform: scale(0.94); }
        .play-btn {
            background: var(--accent); color: #042f2e; border: none; width: 46px; height: 46px; font-size: 18px; font-weight: 700;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        /* Bookshelf Modal */
        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); display: none; align-items: flex-end; justify-content: center; z-index: 50;
        }
        .modal-backdrop.open { display: flex; }
        .modal-sheet {
            background: var(--surface); border-top: 1px solid var(--border); border-radius: 18px 18px 0 0;
            width: 100%; max-width: 640px; max-height: 75dvh; display: flex; flex-direction: column; padding: 16px; gap: 12px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 16px; }
        .book-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .book-item {
            background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .book-info { min-width: 0; flex: 1; }
        .book-title { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .book-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
        .btn-sm { padding: 6px 10px; border-radius: 6px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-open { background: var(--accent); color: #042f2e; }
        .btn-del { background: #e11d48; color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="brand">🎧 AI Story Reader</div>
        <div class="header-actions">
            <button class="pill-btn" onclick="openBookshelf()">📚 Tủ sách</button>
            <label class="pill-btn pill-accent">
                ＋ Mở file
                <input type="file" id="fileInput" accept=".txt,.epub" style="display:none;" onclick="this.value=null;">
            </label>
        </div>
    </header>

    <div class="chapter-bar" id="chapterBar" style="display:none;">
        <select id="chapterSelect" onchange="onChapterChange()"></select>
    </div>

    <main id="storyContainer">
        <div style="text-align:center; padding: 40px 16px; color: var(--text-muted); font-family: sans-serif;">
            <div style="font-size: 40px; margin-bottom: 12px;">📖</div>
            <div style="font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px;">Chưa có truyện nào đang mở</div>
            <div style="font-size: 13px;">Bấm <b>＋ Mở file</b> (.txt / .epub) để bắt đầu đọc sách tức thì mà không cần server.</div>
        </div>
    </main>

    <footer class="player-dock">
        <div class="status-row">
            <span id="status">Sẵn sàng!</span>
            <span id="chunkCounter">0 / 0</span>
        </div>
        <div class="controls-row">
            <select id="voiceSelect" class="dock-select" onchange="onVoiceChange()" title="Chọn giọng đọc">
                <option value="">🎙 Mặc định hệ thống</option>
            </select>

            <div class="transport">
                <button class="ctrl-btn" onclick="prevChunk()" title="Đoạn trước">⏮</button>
                <button class="ctrl-btn play-btn" id="playToggleBtn" onclick="togglePlayPause()" title="Đọc / Dừng">▶</button>
                <button class="ctrl-btn" onclick="nextChunk()" title="Đoạn tiếp">⏭</button>
            </div>

            <select id="speedSelect" class="dock-select" onchange="updateSpeed()" style="max-width:72px;">
                <option value="0.8">0.8x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.2">1.2x</option>
                <option value="1.5">1.5x</option>
                <option value="2.0">2.0x</option>
            </select>
        </div>
    </footer>

    <!-- Bookshelf Modal -->
    <div class="modal-backdrop" id="bookshelfModal" onclick="if(event.target===this) closeBookshelf()">
        <div class="modal-sheet">
            <div class="modal-header">
                <span>📚 Tủ sách lưu trên máy</span>
                <button class="pill-btn" onclick="closeBookshelf()">✕ Đóng</button>
            </div>
            <div class="book-list" id="bookList"></div>
        </div>
    </div>

    <script>
        // --- 1. QUẢN LÝ GIỌNG ĐỌC BROWSER TTS ---
        const voiceSelect = document.getElementById('voiceSelect');
        let voices = [];
        let selectedVoiceIndex = localStorage.getItem("browser_tts_voice_idx") || 0;

        function loadVoices() {
            voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('vi') || v.lang.includes('VN'));
            if (voices.length === 0) voices = window.speechSynthesis.getVoices(); // Fallback mọi giọng nếu không lọc được vi-VN

            voiceSelect.innerHTML = "";
            voices.forEach((v, idx) => {
                const opt = document.createElement("option");
                opt.value = idx;
                opt.textContent = `${v.name} (${v.lang})`;
                voiceSelect.appendChild(opt);
            });
            if (voices.length > 0) {
                if (selectedVoiceIndex < voices.length) voiceSelect.value = selectedVoiceIndex;
                else voiceSelect.value = 0;
            }
        }

        if ('speechSynthesis' in window) {
            loadVoices();
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function onVoiceChange() {
            selectedVoiceIndex = voiceSelect.value;
            localStorage.setItem("browser_tts_voice_idx", selectedVoiceIndex);
            if (isPlaying) {
                window.speechSynthesis.cancel();
                playBrowserTTS(currentChunkIndex);
            }
        }

        // --- 2. INDEXEDDB LOCAL BOOKSHELF ---
        const DB_NAME = "AIStoryReaderBrowserDB";
        const STORE_NAME = "books";
        let currentBookId = localStorage.getItem("last_opened_book_id") || null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: "id" });
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveBookToDB(book) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).put(book);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function getAllBooksFromDB() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const req = tx.objectStore(STORE_NAME).getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => reject(req.error);
            });
        }

        async function getBookById(id) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const req = tx.objectStore(STORE_NAME).get(id);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
        }

        async function deleteBookFromDB(id) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).delete(id);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function saveProgress() {
            if (!currentBookId || chapters.length === 0) return;
            try {
                const book = await getBookById(currentBookId);
                if (book) {
                    book.lastChapter = currentChapterIndex;
                    book.lastChunk = currentChunkIndex;
                    book.updatedAt = Date.now();
                    await saveBookToDB(book);
                }
            } catch (e) {}
        }

        async function openBookshelf() {
            const modal = document.getElementById("bookshelfModal");
            const listEl = document.getElementById("bookList");
            modal.classList.add("open");

            const localBooks = await getAllBooksFromDB();
            if (localBooks.length === 0) {
                listEl.innerHTML = "<div style='color:#94a3b8;font-size:13px;padding:12px 0;'>Tủ sách trống. Hãy bấm <b>＋ Mở file</b> để thêm truyện!</div>";
                return;
            }

            listEl.innerHTML = "";
            localBooks.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).forEach(b => {
                const item = document.createElement("div");
                item.className = "book-item";
                const chapNum = (b.lastChapter || 0) + 1;

                item.innerHTML = `
                    <div class="book-info">
                        <div class="book-title">${b.title}</div>
                        <div class="book-meta">${b.chapters.length} chương • Đọc đến Ch.${chapNum}</div>
                    </div>
                    <div class="book-actions">
                        <button class="btn-sm btn-open">Đọc tiếp</button>
                        <button class="btn-sm btn-del">Xóa</button>
                    </div>
                `;

                item.querySelector(".btn-open").onclick = () => {
                    closeBookshelf();
                    loadBookObject(b);
                };

                item.querySelector(".btn-del").onclick = async () => {
                    await deleteBookFromDB(b.id);
                    if (currentBookId === b.id) {
                        currentBookId = null;
                        localStorage.removeItem("last_opened_book_id");
                    }
                    openBookshelf();
                };
                listEl.appendChild(item);
            });
        }

        function closeBookshelf() {
            document.getElementById("bookshelfModal").classList.remove("open");
        }

        function loadBookObject(book) {
            stopTTS();
            currentBookId = book.id;
            localStorage.setItem("last_opened_book_id", book.id);
            chapters = book.chapters;

            chapterSelect.innerHTML = "";
            chapters.forEach((chap, idx) => {
                const opt = document.createElement("option");
                opt.value = idx;
                opt.textContent = chap.title;
                chapterSelect.appendChild(opt);
            });
            document.getElementById("chapterBar").style.display = "flex";

            const targetChap = Math.min(book.lastChapter || 0, chapters.length - 1);
            chapterSelect.value = targetChap;
            renderChapter(targetChap, book.lastChunk || 0);
            status.textContent = `📖 Đã mở: ${book.title}`;
        }

        // --- 3. ROBUST FILE PARSER (FIX TRỆT ĐỂ LỖI NHẢY CÓC CHƯƠNG) ---
        const fileInput = document.getElementById('fileInput');
        const storyContainer = document.getElementById('storyContainer');
        const status = document.getElementById('status');
        const chapterSelect = document.getElementById('chapterSelect');
        const speedSelect = document.getElementById('speedSelect');
        const playToggleBtn = document.getElementById('playToggleBtn');
        const chunkCounter = document.getElementById('chunkCounter');

        let chapters = [];
        let currentChapterIndex = 0;
        let chunks = [];
        let currentChunkIndex = 0;
        let isPlaying = false;

        // Âm thanh nền giữ màn hình khóa (Lock-screen Keep-Alive)
        const silentAudio = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQQAAAAAAA==");
        silentAudio.loop = true;

        function processRawTextToChunks(rawText) {
            const rawLines = rawText.split(/\r?\n/);
            const valid = [];
            for (let line of rawLines) {
                let trimmed = line.replace(/\s+/g, ' ').trim();
                if (trimmed) valid.push(trimmed);
            }
            return valid;
        }

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files.item(0);
            if (!file) return;

            stopTTS();
            status.textContent = `⏳ Đang phân tích file chuẩn xác: ${file.name}...`;
            let parsedChapters = [];

            try {
                if (file.name.toLowerCase().endsWith('.txt')) {
                    const text = await file.text();
                    const lines = text.split(/\r?\n/);
                    let currentTitle = "Toàn bộ nội dung";
                    let currentParas = [];
                    let chapCount = 1;

                    for (let line of lines) {
                        let trimmed = line.trim();
                        // Thuật toán quét tiêu đề chính xác bắt đầu bằng Chương/Hồi/Chapter ở đầu dòng
                        if (/^(?:Chương|Hồi|Quyển|Phần|Chapter)\s+[\dIVXLCDM]+/i.test(trimmed) && trimmed.length < 80) {
                            if (currentParas.length > 0) {
                                parsedChapters.push({ title: currentTitle, paragraphs: currentParas });
                                currentParas = [];
                            }
                            currentTitle = trimmed;
                        } else if (trimmed) {
                            currentParas.push(trimmed);
                        }
                    }
                    if (currentParas.length > 0) {
                        parsedChapters.push({ title: currentTitle, paragraphs: currentParas });
                    }
                    if (parsedChapters.length === 0) {
                        parsedChapters.push({ title: file.name, paragraphs: processRawTextToChunks(text) });
                    }
                } else if (file.name.toLowerCase().endsWith('.epub')) {
                    const zip = await JSZip.loadAsync(file);
                    const parser = new DOMParser();

                    // Đọc chuẩn cấu trúc OPF và Spine để lấy danh sách chương theo đúng thứ tự gốc
                    let opfPath = "";
                    const containerFile = zip.file("META-INF/container.xml");
                    if (containerFile) {
                        const containerXml = await containerFile.async("text");
                        const containerDoc = parser.parseFromString(containerXml, "text/xml");
                        const rootfile = containerDoc.getElementsByTagName("rootfile")[0];
                        if (rootfile) opfPath = rootfile.getAttribute("full-path");
                    }

                    let spinePaths = [];
                    let manifest = {};

                    if (opfPath && zip.file(opfPath)) {
                        const opfFolder = opfPath.includes('/') ? opfPath.substring(0, opfPath.lastIndexOf('/') + 1) : "";
                        const opfXml = await zip.file(opfPath).async("text");
                        const opfDoc = parser.parseFromString(opfXml, "text/xml");

                        const items = opfDoc.getElementsByTagName("item");
                        for (let item of items) {
                            const id = item.getAttribute("id");
                            const href = item.getAttribute("href");
                            if (id && href) manifest[id] = opfFolder + href;
                        }

                        const itemrefs = opfDoc.getElementsByTagName("itemref");
                        for (let ref of itemrefs) {
                            const idref = ref.getAttribute("idref");
                            if (idref && manifest[idref]) spinePaths.push(manifest[idref]);
                        }
                    }

                    if (spinePaths.length === 0) {
                        spinePaths = Object.keys(zip.files).filter(k => /\.(html|xhtml|htm)$/i.test(k)).sort();
                    }

                    for (let i = 0; i < spinePaths.length; i++) {
                        const path = spinePaths[i];
                        const zipFile = zip.file(path) || zip.file(decodeURIComponent(path));
                        if (zipFile) {
                            const htmlContent = await zipFile.async("text");
                            const doc = parser.parseFromString(htmlContent, "text/html");
                            doc.querySelectorAll("script, style, nav").forEach(el => el.remove());
                            const textContent = doc.body ? doc.body.textContent : doc.textContent;
                            const paras = processRawTextToChunks(textContent);

                            if (paras.length > 1) {
                                let titleEl = doc.querySelector("h1, h2, h3");
                                let chapTitle = titleEl ? titleEl.textContent.trim() : "";
                                if (!chapTitle || chapTitle.length > 60 || /cover|title|mục lục/i.test(chapTitle)) {
                                    chapTitle = paras[0].length < 50 ? paras[0] : `Chương ${parsedChapters.length + 1}`;
                                }
                                parsedChapters.push({ title: chapTitle, paragraphs: paras });
                            }
                        }
                    }
                    if (parsedChapters.length === 0) throw new Error("Không tìm thấy chương hợp lệ trong file EPUB.");
                }

                const bookObj = {
                    id: file.name + "_" + file.size,
                    title: file.name.replace(/\.(txt|epub)$/i, ""),
                    chapters: parsedChapters,
                    lastChapter: 0,
                    lastChunk: 0,
                    updatedAt: Date.now()
                };

                await saveBookToDB(bookObj);
                loadBookObject(bookObj);
                status.textContent = `✅ Đã phân tích thành công (${parsedChapters.length} chương)!`;
            } catch (err) {
                status.textContent = `❌ Lỗi đọc file: ${err.message}`;
            }
        });

        function onChapterChange() {
            const wasPlaying = isPlaying;
            stopTTS();
            const targetIdx = parseInt(chapterSelect.value, 10);
            renderChapter(targetIdx, 0);
            saveProgress();
            if (wasPlaying) startTTS(0);
        }

        function renderChapter(index, startChunk = 0) {
            currentChapterIndex = index;
            const chap = chapters[currentChapterIndex];
            if (!chap) return;

            chunks = chap.paragraphs;
            currentChunkIndex = Math.min(startChunk, Math.max(0, chunks.length - 1));

            storyContainer.innerHTML = chunks.map((text, idx) => {
                return `<p id="para-${idx}" onclick="startTTS(${idx})">${text}</p>`;
            }).join('');

            highlightParagraph(currentChunkIndex);
        }

        // --- 4. BROWSER TTS REALTIME INSTANT PLAY (NO DELAY) ---
        function updateMediaSession() {
            if ('mediaSession' in navigator && chapters[currentChapterIndex]) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: chapters[currentChapterIndex].title,
                    artist: `Đoạn ${currentChunkIndex + 1}/${chunks.length}`,
                    album: "AI Story Reader"
                });
                navigator.mediaSession.playbackState = isPlaying ? "playing" : "paused";
                navigator.mediaSession.setActionHandler('play', () => startTTS(currentChunkIndex));
                navigator.mediaSession.setActionHandler('pause', () => stopTTS());
                navigator.mediaSession.setActionHandler('previoustrack', () => prevChunk());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextChunk());
            }
        }

        function togglePlayPause() {
            if (isPlaying) {
                stopTTS();
            } else {
                startTTS(currentChunkIndex);
            }
        }

        function prevChunk() {
            if (chunks.length === 0) return;
            const prev = Math.max(0, currentChunkIndex - 1);
            startTTS(prev);
        }

        function nextChunk() {
            if (chunks.length === 0) return;
            if (currentChunkIndex + 1 < chunks.length) {
                startTTS(currentChunkIndex + 1);
            } else if (currentChapterIndex + 1 < chapters.length) {
                currentChapterIndex++;
                chapterSelect.value = currentChapterIndex;
                renderChapter(currentChapterIndex, 0);
                startTTS(0);
            }
        }

        function startTTS(startIndex = 0) {
            if (chunks.length === 0) {
                alert("Vui lòng mở file truyện trước!");
                return;
            }

            if (!('speechSynthesis' in window)) {
                alert("Trình duyệt không hỗ trợ Web Speech API!");
                return;
            }

            window.speechSynthesis.cancel();
            currentChunkIndex = startIndex;
            isPlaying = true;
            playToggleBtn.textContent = "■";

            silentAudio.play().catch(() => {});
            updateMediaSession();
            playBrowserTTS(currentChunkIndex);
        }

        function playBrowserTTS(idx) {
            if (!isPlaying || idx >= chunks.length) {
                if (idx >= chunks.length) {
                    if (currentChapterIndex + 1 < chapters.length) {
                        currentChapterIndex++;
                        chapterSelect.value = currentChapterIndex;
                        renderChapter(currentChapterIndex, 0);
                        saveProgress();
                        playBrowserTTS(0);
                        return;
                    } else {
                        status.textContent = "✅ Đã đọc xong toàn bộ truyện!";
                        stopTTS();
                    }
                }
                return;
            }

            currentChunkIndex = idx;
            highlightParagraph(idx);
            saveProgress();
            status.textContent = `🔊 [${chapters[currentChapterIndex].title}] - Đoạn ${idx + 1}/${chunks.length}`;
            updateMediaSession();

            const text = chunks[idx];
            const utterance = new SpeechSynthesisUtterance(text);
            
            if (voices[selectedVoiceIndex]) {
                utterance.voice = voices[selectedVoiceIndex];
            }
            utterance.lang = 'vi-VN';
            utterance.rate = parseFloat(speedSelect.value);

            utterance.onend = () => {
                if (isPlaying) playBrowserTTS(currentChunkIndex + 1);
            };

            utterance.onerror = () => {
                if (isPlaying) playBrowserTTS(currentChunkIndex + 1);
            };

            window.speechSynthesis.speak(utterance);
        }

        function highlightParagraph(index) {
            document.querySelectorAll('#storyContainer p.active-chunk').forEach(p => p.classList.remove('active-chunk'));
            chunkCounter.textContent = chunks.length > 0 ? `${index + 1} / ${chunks.length}` : "0 / 0";
            const activePara = document.getElementById(`para-${index}`);
            if (activePara) {
                activePara.classList.add('active-chunk');
                if (document.visibilityState === 'visible') {
                    activePara.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function updateSpeed() {
            if (isPlaying) {
                window.speechSynthesis.cancel();
                playBrowserTTS(currentChunkIndex);
            }
        }

        function stopTTS(customMessage = "⏹ Đã tạm dừng.") {
            isPlaying = false;
            silentAudio.pause();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            playToggleBtn.textContent = "▶";
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
            status.textContent = customMessage;
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible" && isPlaying) {
                silentAudio.play().catch(() => {});
                const activePara = document.getElementById(`para-${currentChunkIndex}`);
                if (activePara) activePara.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });

        (async () => {
            if (currentBookId) {
                const savedBook = await getBookById(currentBookId);
                if (savedBook) loadBookObject(savedBook);
            }
        })();
    </script>
</body>
</html>
